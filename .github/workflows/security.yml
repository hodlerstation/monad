name: Dependency security and compatibility
on:
  pull_request:
  push:
    branches: [master, codex/submission-source-audit, codex/public-mission-host]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run codegen
      - run: node --test tests/handler.test.mjs
      - run: npm run typecheck
      - run: npm audit --audit-level=low
      - run: npm ci
        working-directory: modules
      - run: npm test
        working-directory: modules
      - run: npm run typecheck
        working-directory: modules
      - run: npm run demo:build -- --logLevel error
        working-directory: modules
      - run: npm run reference:verify
      - run: npm audit --audit-level=low
        working-directory: modules
  cloud-pnpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Cloud resolves dependencies afresh instead of using the committed lock.
      - run: rm pnpm-lock.yaml
      - run: npx --yes pnpm@10.32.0 install --no-frozen-lockfile
      - run: npx --yes pnpm@10.32.0 codegen
      - run: npx --yes pnpm@10.32.0 typecheck
      - run: npx --yes pnpm@10.32.0 audit --audit-level=low
